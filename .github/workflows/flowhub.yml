name: FlowHub CI

on:
  push:
    branches: [main, "kilo/**"]
    paths:
      - "flowhub/**"
      - ".github/workflows/flowhub.yml"
  pull_request:
    paths:
      - "flowhub/**"
      - ".github/workflows/flowhub.yml"

defaults:
  run:
    working-directory: flowhub

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build frontend
        run: bun run build

      - name: Docker build
        run: docker build -t flowhub:ci .

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Build frontend
        run: bun run build

      - name: Run E2E
        run: bun run test:ui
        env:
          CI: "1"
