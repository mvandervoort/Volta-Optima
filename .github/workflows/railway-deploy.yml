name: Deploy to Railway

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Use Node.js 16.x
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Voer tests uit vóór deployment
          echo "Running pre-deployment checks..."
          
          # Als het een PR is, maak een preview deployment
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Creating railway preview deployment..."
            railway up --detach --service "volta-optima" --environment "preview"
          # Als het main/master is, deploy naar productie
          else
            echo "Deploying to railway production..."
            railway up --detach --service "volta-optima" --environment "production"
          fi