services:
  app:
    build: .
    image: flowhub:local
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      FLOWHUB_CONFIG: /etc/flowhub/config.json
      FLOWHUB_DATA_DIR: /data
      FLOWHUB_PORT: "8080"
      FLOWHUB_SESSION_SECRET: ${FLOWHUB_SESSION_SECRET:?set FLOWHUB_SESSION_SECRET in .env}
      FLOWHUB_ADMIN_USER: ${FLOWHUB_ADMIN_USER:-admin}
      FLOWHUB_ADMIN_PASSWORD: ${FLOWHUB_ADMIN_PASSWORD:?set FLOWHUB_ADMIN_PASSWORD in .env}
      FLOWHUB_INSECURE_COOKIE: ${FLOWHUB_INSECURE_COOKIE:-0}
      FLOWHUB_TRUST_PROXY: "1"
    volumes:
      - ./config.json:/etc/flowhub/config.json:ro
      - flowhub-data:/data
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - flowhub

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - flowhub

volumes:
  flowhub-data:
  caddy-data:
  caddy-config:

networks:
  flowhub:
    driver: bridge